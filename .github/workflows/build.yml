name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # compileSdk 37 平台在 Google SDK 仓库中的包名为 platforms;android-37.2（major.minor 命名），
      # runner 镜像未预装，用 sdkmanager 补装（显式路径，不在默认 PATH）；
      # AGP 按整数 compileSdk=37 查找 platforms/android-37 目录，故创建符号链接兼容
      - name: Install Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" --channel=3 "platforms;android-37.2"
          ln -sfn android-37.2 "$ANDROID_HOME/platforms/android-37"
          ls -la "$ANDROID_HOME/platforms/"

      # 若仓库内缺 gradle-wrapper.jar（二进制无法通过 API 推送时），在此下载补齐
      - name: Ensure gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK (debug-signed)
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hidpager-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
