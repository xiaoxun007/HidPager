name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        type: string
        default: '1.1'
        description: Release versionName（如 1.1）
      version_code:
        type: string
        default: '2'
        description: Release versionCode（整数，如 2）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # compileSdk 36 平台：幂等补装（runner 镜像通常已预装，未装时自动补齐；显式路径调用 sdkmanager）
      - name: Ensure Android SDK platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-36"

      # 若仓库内缺 gradle-wrapper.jar（二进制无法通过 API 推送时），在此下载补齐
      - name: Ensure gradle wrapper jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 从 GitHub Secrets 解码 release keystore 到 runner 临时目录，注入 env（命令文本不出现 secret 值，日志不回显）
      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hidpager.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/hidpager.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionName=${{ inputs.version_name || '1.0' }} -PversionCode=${{ inputs.version_code || '1' }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hidpager-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
